<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Chat – Name</title></head>
  <body>
    <h1>Chat Login</h1>

    {% if error %}
      <p style="color:red">{{ error }}</p>
    {% endif %}

    <form method="post">
      <label>Dein Name:</label>
      <input name="name" autocomplete="nickname" required>
      <button type="submit">Weiter</button>
    </form>
  </body>
</html>
